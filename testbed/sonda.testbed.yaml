# Sonda's view of the bookshop.
#
# Everything binds 0.0.0.0 because these ports are published out of the
# container; compose publishes them to the host's loopback only. The upstreams
# are compose service names on the test bed's own network.
#
# api_listen is deliberately absent: compose passes `-api-listen 0.0.0.0:9400`
# on the command line, and a second value here would be silently overridden.
#
# These targets are a seed. Sonda turns them into a project called `bookshop`
# the first time the database is created — the directory this file sits in
# inside the container is where that name comes from — and ignores them
# afterwards, so an edit made in the interface is never undone by this file.

database: /data/sonda.db
max_body_bytes: 262144
buffer_size: 1024

retention:
  max_calls: 50000
  max_age: 24h
  interval: 1m

targets:
  - name: gateway
    listen: 0.0.0.0:9401
    upstream: http://gateway:8100
    protocol: http

  - name: catalog
    listen: 0.0.0.0:9402
    upstream: http://catalog:8101
    protocol: http

  - name: storefront
    listen: 0.0.0.0:9403
    upstream: http://storefront:8102
    protocol: http

  # The price service serves no reflection, so the field names have to come
  # from a compiled descriptor set. Without these two lines the messages still
  # decode, as numbered fields with guessed types.
  - name: pricing
    listen: 0.0.0.0:9404
    upstream: http://pricing:8103
    protocol: grpc
    descriptor_set: /etc/bookshop/descriptors.binpb
    reflection: false

  # Declared, and deliberately not running. `docker compose --profile shipping
  # up -d shipping` is what turns this from a 502 into a 200.
  - name: shipping
    listen: 0.0.0.0:9405
    upstream: http://shipping:8104
    protocol: http

  # The hop underneath. The catalog's DSN points here and keeps its own user,
  # password and database name; this upstream carries none of them, and Sonda
  # refuses one that does.
  - name: catalog-db
    listen: 0.0.0.0:9406
    upstream: postgres://postgres:5432
    protocol: postgres

  # The same storefront, behind a listener that answers with a certificate of
  # its own, for the TLS exercise. Nothing else in the shop uses this port.
  - name: storefront-tls
    listen: 0.0.0.0:9407
    upstream: http://storefront:8102
    protocol: http
    tls: true
