# Sonda — configuration for running against services on this machine.
#
# One target per service you want to observe. Point the client at `listen`
# instead of the real address and Sonda forwards to `upstream`, capturing
# both halves on the way through.
#
# Copy this file to sonda.yaml and edit it.

api_listen: 127.0.0.1:9000
database: sonda.db

# Bytes kept per body. The whole body always reaches its destination; this
# only caps what is stored.
max_body_bytes: 262144

# Calls buffered in memory while waiting to be written. When the buffer is
# full, captures are dropped rather than slowing down the traffic, and the
# drop count shows up in GET /api/stats.
buffer_size: 1024

retention:
  max_calls: 50000
  max_age: 24h
  interval: 1m

targets:
  - name: echo
    listen: 127.0.0.1:9101
    upstream: http://127.0.0.1:8081
    protocol: http

  - name: orders
    listen: 127.0.0.1:9201
    upstream: http://127.0.0.1:8082
    protocol: grpc
    # Reflection defaults to on. When the service serves it, Sonda discovers
    # the schema by itself and nothing else is needed.
    #
    # When it does not, compile the protos and point at the result:
    #   buf build -o descriptors.binpb
    #   protoc --descriptor_set_out=descriptors.binpb --include_imports ...
    # descriptor_set: examples/grpcdemo/descriptors.binpb
    # reflection: false

  # Real service, for reference. Whatever calls it uses 127.0.0.1:9102.
  # - name: admin-api
  #   listen: 127.0.0.1:9102
  #   upstream: http://127.0.0.1:3000
  #   protocol: http

  # A hosted API over TLS. The upstream keeps its https:// scheme and Sonda
  # verifies its certificate like any other client would.
  # - name: payments
  #   listen: 127.0.0.1:9103
  #   upstream: https://api.payments.example.com
  #   protocol: http

  # A client that refuses to speak http://. `tls: true` makes Sonda answer this
  # port with a certificate of its own, so the caller is pointed at
  # https://127.0.0.1:9104 instead. The certificate is signed by an authority
  # Sonda generates beside the database — nothing is added to this machine's
  # trust store, and the first run prints the command to trust it yourself.
  # - name: web-api
  #   listen: 127.0.0.1:9104
  #   upstream: http://127.0.0.1:3000
  #   protocol: http
  #   tls: true

  # An upstream with a self-signed certificate. This is the only way to stop
  # Sonda checking it, it applies to this one service, and every capture taken
  # through it is recorded as unverified and shown as unverified everywhere.
  # Sonda refuses it on an http:// upstream, where it would mean nothing.
  # - name: staging
  #   listen: 127.0.0.1:9105
  #   upstream: https://staging.internal:8443
  #   protocol: http
  #   insecure_skip_verify: true

  # A database. Point the application's DSN at the listen address — keeping its
  # own user, password and database name — and the SQL it runs shows up as
  # captures beside the HTTP calls that caused it:
  #
  #   DATABASE_URL=postgres://app:secret@127.0.0.1:9301/orders
  #
  # The upstream carries no credentials on purpose. Sonda forwards the client's
  # own handshake, so it has no use for them, and a password written here would
  # be a password written into sonda.db.
  # - name: orders-db
  #   listen: 127.0.0.1:9301
  #   upstream: postgres://127.0.0.1:5432
  #   protocol: postgres
