services:
  sonda:
    build: .
    # Published to the host's loopback and no further: sonda.db holds whatever
    # credentials crossed the wire, in plaintext and behind no login, and a bare
    # "9000:9000" would offer all of it to the local network.
    ports:
      - "127.0.0.1:9000:9000" # query API
      - "127.0.0.1:9101:9101" # proxy in front of the echo service
      - "127.0.0.1:9201:9201" # proxy in front of the gRPC service
    volumes:
      - ./sonda.docker.yaml:/etc/sonda/sonda.yaml:ro
      - sonda-data:/data
    # busybox wget, already in the base image, so the healthcheck adds nothing
    # to the container.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - echo
      - grpcdemo

  # Toy upstreams so the stack does something on the first run. Their ports are
  # not published on purpose: traffic is supposed to arrive through Sonda.
  echo:
    build: .
    entrypoint: ["echo"]
    command: ["-addr", ":8081"]

  grpcdemo:
    build: .
    entrypoint: ["grpcdemo"]
    command: ["-addr", ":8082", "-reflection=true"]

  # The terminal client. Behind a profile because it is something you run, not
  # something that runs: `docker compose run --rm tui`.
  tui:
    build: .
    profiles: ["tui"]
    entrypoint: ["sonda-tui"]
    command: ["-api", "http://sonda:9000"]
    tty: true
    stdin_open: true
    depends_on:
      - sonda

volumes:
  sonda-data:
