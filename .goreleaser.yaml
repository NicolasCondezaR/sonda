# Release build.
#
# Every binary here is pure Go — the SQLite driver is `modernc.org/sqlite`,
# chosen precisely so there is no cgo — which is why six platforms cross-compile
# from one runner without a C toolchain in sight.
#
# The archives carry all four binaries, not just the proxy. The quick start in
# the README builds `echo` and `grpcdemo` from source to have something to
# capture; shipping them means someone who downloaded a zip can follow it
# without installing Go, which is the whole point of publishing binaries.
version: 2

project_name: sonda

before:
  hooks:
    # Download, not tidy: a release must build what the tag says, and a hook
    # that can rewrite go.mod mid-release is a way to ship something the tag
    # never contained.
    - go mod download

builds:
  - id: sonda
    main: ./cmd/sonda
    binary: sonda
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # Only this binary carries the tag: it is the one with -version, and
    # setting a symbol the others do not define would be noise.
    ldflags:
      - -s -w -X main.release={{ .Tag }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: sonda-tui
    main: ./cmd/sonda-tui
    binary: sonda-tui
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: echo
    main: ./examples/echo
    binary: echo
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: grpcdemo
    main: ./examples/grpcdemo
    binary: grpcdemo
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: sonda
    ids: [sonda, sonda-tui, echo, grpcdemo]
    name_template: "sonda_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README.es.md
      - LICENSE
      - sonda.example.yaml

checksum:
  name_template: checksums.txt

# Both taps live in repositories of their own, so the workflow needs a token
# that reaches beyond this one. GITHUB_TOKEN cannot, by design.
#
# A cask rather than a formula: GoReleaser deprecated formulas for binaries,
# and this is the supported path. The cost is that casks are macOS only —
# Linux keeps `go install`, the image and the tarball, which is no loss.
homebrew_casks:
  - name: sonda
    repository:
      owner: NicolasCondezaR
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/NicolasCondezaR/sonda"
    description: "Proxy depurador de tráfico de desarrollo: HTTP y gRPC, con protobuf decodificado y los trailers preservados"
    license: MIT

    # Only the two tools go on the PATH. The archive also carries `echo` and
    # `grpcdemo` for the quick start, and Homebrew puts its bin directory
    # *before* /usr/bin — so installing a binary named `echo` there would
    # shadow the system one for every script on the machine. A debugging tool
    # has no business doing that.
    binaries:
      - sonda
      - sonda-tui

    # The binaries are not signed, and macOS quarantines anything unsigned that
    # arrives from the network. Without this, `brew install` would appear to
    # succeed and then produce a binary the system refuses to run — the worst
    # possible failure, because it looks like the tool is broken rather than
    # unsigned.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sonda"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sonda-tui"]
          end

scoops:
  - name: sonda
    repository:
      owner: NicolasCondezaR
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/NicolasCondezaR/sonda"
    description: "Proxy depurador de tráfico de desarrollo: HTTP y gRPC, con protobuf decodificado y los trailers preservados"
    license: MIT
    # Scoop shims every binary in the archive and there is no way to select a
    # subset. It is harmless here: `echo` is an internal command in both cmd
    # and PowerShell, so an echo.exe on the PATH is never what gets run.

changelog:
  use: github
  sort: asc

release:
  # A tag with a hyphen (v0.2.0-rc1) is marked as a prerelease; a plain one is
  # not. Nothing to remember at tag time.
  prerelease: auto

  # Makes a retry work. A release publishes the archives before it writes the
  # taps, so anything that fails in between — an expired token, a network
  # blip — leaves a release whose assets already exist. The default
  # keep-existing then refuses to upload them again and the retry dies on the
  # step that already succeeded, never reaching the one that failed.
  mode: replace
  footer: |
    ---

    ## Instalación

    Descarga el archivo de tu plataforma, descomprímelo y ejecuta `sonda`. No
    hay nada que instalar: los binarios son estáticos y no dependen de Go ni de
    una biblioteca de SQLite en el sistema.

    ```
    ./sonda            # el proxy y la interfaz, en http://127.0.0.1:9000
    ./sonda -version   # qué build es este
    ./sonda-tui        # el cliente de terminal
    ```

    El archivo trae también `echo` y `grpcdemo`, los dos servicios de ejemplo
    que usa el arranque rápido del README, para poder ver tráfico capturado sin
    tener que levantar nada propio.

    Verifica la descarga con `checksums.txt`.
