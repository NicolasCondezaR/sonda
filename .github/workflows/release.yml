name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # CI runs on pushes to main and on pull requests, neither of which covers a
  # tag. Without this, tagging a commit that never went through main would
  # publish binaries and an image nothing had tested — so both jobs below wait
  # on it rather than each running their own half-check.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the history between tags, and
          # a shallow clone has none of it.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writing the cask and the Scoop manifest means committing to
          # homebrew-tap and scoop-bucket, which are other repositories.
          # GITHUB_TOKEN is scoped to this one by design, so it cannot.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns the tag into the usual set: v0.1.0 publishes 0.1.0, 0.1 and
      # latest, so a compose file can pin as tightly or as loosely as it wants.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RELEASE=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
